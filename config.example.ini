# ============================================================
#  IMTIHON NAZORATI — SOZLAMALAR (namuna)
#  Bu faylni config.ini deb nusxalang va qiymatlarni o'zgartiring.
#  Bu fayl HAM serverda, HAM talaba kompyuterida bo'ladi.
#  Faqat "token" server va klientda BIR XIL bo'lishi SHART.
# ============================================================

[common]
# Maxfiy parol (begona qurilma ulanmasligi uchun). O'ZGARTIRING:
token = change-me
# Asosiy ulanish porti:
port = 50200
# Avtomatik topish (discovery) uchun UDP port:
discovery_port = 50201
# Ovoz (mikrofon) uzatish uchun port:
audio_port = 50202

[server]
# Imtihon jurnali saqlanadigan papka (server papkasiga nisbatan):
log_dir = logs

[client]
# Serverni qanday topish:
#   auto            -> tarmoqdan avtomatik topadi (IP yozish shart emas)
#   192.168.1.100   -> aniq IP yozsangiz, o'shanga ulanadi
server = auto
# Faol oynani necha soniyada yuborish:
status_interval = 1.0
# Ekran rasmini necha soniyada yuborish (0 = ekran ko'rishni o'chirish):
screenshot_interval = 3.0
# Yuboriladigan rasm kengligi, piksel (kichik = tezroq, kam trafik):
screenshot_width = 480
# Ekrandagi "Imtihon nazorati faol" belgisini ko'rsatish:
#   true  -> belgi ko'rinadi (shaffof rejim)
#   false -> belgi ko'rinmaydi (imtihon vaqtida bezovta qilmaydi)
show_banner = false
