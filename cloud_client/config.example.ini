# ============================================================
#  TALABA KLIENTI — BULUTLI versiya sozlamalari (namuna)
#  Bu faylni config.ini deb nusxalang va qiymatlarni kiriting.
# ============================================================

[common]
# Maxfiy token — serverdagi EXAM_TOKEN bilan BIR XIL bo'lishi SHART:
token = change-me

[client]
# Bulutli server manzili (Render bergan URL). wss:// yoki https:// bo'ladi:
server = wss://sizning-app.onrender.com

# Sinf kodi — o'qituvchi panelidagi "room" bilan BIR XIL bo'lsin:
room = 7-A

# Talaba ismi (bo'sh qoldirsangiz — kompyuter nomi ishlatiladi):
name =

# Faol oynani necha soniyada yuborish:
status_interval = 1.0
# Ekran rasmini necha soniyada yuborish (0 = ekran ko'rishni o'chirish):
screenshot_interval = 3.0
# Yuboriladigan rasm kengligi, piksel (kichik = tezroq, kam trafik):
screenshot_width = 480
# Ekrandagi "Imtihon nazorati faol" belgisini ko'rsatish (shaffoflik uchun true tavsiya etiladi):
show_banner = true
